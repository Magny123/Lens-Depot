<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>

    <style>
          body{
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color:#7af3cb ;
          }
        
          .inpt{
            border-style: solid;
            border-width: 1.7px;
            width: 85%;
            height: 30px;
            border-radius: 5px;
            padding-left: 10px;

          }
          .input{
            margin-top: 15px;
          }
          .bout{
            background-color:#36b46a;
            width: 90%;
            height: 30px;
            border-style: none;
            color: white;
            border-radius: 5px;
          }
          .backg-blanc{
            background-color: white;
            margin-top: 15px;
            padding-top: 15px;
            border-radius: 10px;
            width: 350px;
          }
          .ryvix-blanc{
            color: white;
            font-family: sans-serif;
            font-size: 25px;
          }
          .lab-jaune{
            color: rgb(247, 212, 58);
            font-size: 25px;
            font-family: sans-serif;
          }
    </style>
</head>
<body>
           <div class="Dv-second-princ">
                 <div class="Dv-ryvix">
                      <strong class="ryvix-blanc">Ryvix</strong><strong class="lab-jaune">Lab</strong>
                 </div>
                 <div class="backg-blanc">
                         <strong class="Connexion">Conexion</strong>
                         <div class="input">
                                <input type="email" placeholder="Utilisateur ou Email" class="inpt">
                         </div>
                          <div class="input">
                               <input type="password" placeholder="Mot de passe" class="inpt">
                         </div>
                          <div class="input">
                              <button class="bout">Se connecter</button>
                         </div>
                         <p>En cliquant sur Se connecter,vous accepter nos Conditions d'utilisation et notre Politique de confidentialite</p>
                 </div>
           </div>
</body>
</html>
